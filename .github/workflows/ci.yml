name: CI

on:
  pull_request:
  push:
    branches: [master, develop]

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      # --webpack is required: next-pwa and the react-pdf canvas alias do not work under Turbopack
      - run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: 1
