# GitLab CI/CD Pipeline for Angelo Tutoring Platform
# Next.js 16 Application with PostgreSQL, Supabase Auth, PWA, i18n

# ============================================================================
# PIPELINE STAGES
# ============================================================================
stages:
  - validate        # Code quality and linting
  - test           # Unit and integration tests
  - build          # Build artifacts
  - infrastructure # Infrastructure provisioning (Terraform/IaC)
  - deploy-staging # Deploy to staging environment
  - deploy-prod    # Deploy to production environment

# ============================================================================
# GLOBAL VARIABLES
# ============================================================================
variables:
  # Node.js configuration
  NODE_VERSION: "20"
  NPM_CONFIG_CACHE: "$CI_PROJECT_DIR/.npm"
  NEXT_TELEMETRY_DISABLED: "1"

  # Build optimization
  NEXT_PUBLIC_BUILD_ID: "$CI_COMMIT_SHORT_SHA"

  # Cache configuration
  CACHE_KEY: "$CI_COMMIT_REF_SLUG-node-modules"

# ============================================================================
# CACHE CONFIGURATION
# ============================================================================
# Global cache for node_modules to speed up builds
.node_cache: &node_cache
  cache:
    key:
      files:
        - package-lock.json
      prefix: ${CI_COMMIT_REF_SLUG}
    paths:
      - node_modules/
      - .npm/
      - .next/cache/
    policy: pull

.node_cache_push: &node_cache_push
  cache:
    key:
      files:
        - package-lock.json
      prefix: ${CI_COMMIT_REF_SLUG}
    paths:
      - node_modules/
      - .npm/
      - .next/cache/
    policy: pull-push

# ============================================================================
# JOB TEMPLATES
# ============================================================================
.node_base:
  image: node:${NODE_VERSION}-alpine
  before_script:
    - apk add --no-cache git curl
    - node --version
    - npm --version
    - echo "Pipeline for commit ${CI_COMMIT_SHORT_SHA} on ${CI_COMMIT_REF_NAME}"

.only_branches: &only_branches
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == "main" || $CI_COMMIT_BRANCH == "master"'
    - if: '$CI_COMMIT_BRANCH == "develop"'
    - if: '$CI_COMMIT_TAG'

# ============================================================================
# STAGE: VALIDATE
# ============================================================================

# Install dependencies (runs first, pushes to cache)
install_dependencies:
  extends: .node_base
  stage: validate
  <<: *node_cache_push
  script:
    - echo "Installing dependencies..."
    - npm ci --prefer-offline --no-audit
    - echo "Dependencies installed successfully"
  artifacts:
    expire_in: 1 hour
    paths:
      - node_modules/
  <<: *only_branches

# ESLint - Code quality check
lint:
  extends: .node_base
  stage: validate
  <<: *node_cache
  needs: [install_dependencies]
  script:
    - echo "Running ESLint..."
    - npm run lint
  allow_failure: false
  <<: *only_branches

# TypeScript type checking
typecheck:
  extends: .node_base
  stage: validate
  <<: *node_cache
  needs: [install_dependencies]
  script:
    - echo "Running TypeScript type checking..."
    - npx tsc --noEmit
  allow_failure: false
  <<: *only_branches

# Dependency security audit
security_audit:
  extends: .node_base
  stage: validate
  <<: *node_cache
  needs: [install_dependencies]
  script:
    - echo "Running npm audit..."
    - npm audit --production --audit-level=high || true
    - echo "Checking for known vulnerabilities..."
  allow_failure: true
  <<: *only_branches

# ============================================================================
# STAGE: TEST
# ============================================================================

# Unit tests (placeholder - add when test framework is configured)
test_unit:
  extends: .node_base
  stage: test
  <<: *node_cache
  needs: [install_dependencies]
  script:
    - echo "No test framework configured yet"
    - echo "To add tests, install Jest or Vitest and update this job"
    - echo "Example: npm run test -- --coverage"
  allow_failure: true
  <<: *only_branches

# Database migration validation
validate_migrations:
  extends: .node_base
  stage: test
  <<: *node_cache
  needs: [install_dependencies]
  script:
    - echo "Validating Drizzle migrations..."
    - npm run db:generate -- --check || echo "No migration changes detected"
  allow_failure: true
  <<: *only_branches

# ============================================================================
# STAGE: BUILD
# ============================================================================

build_application:
  extends: .node_base
  stage: build
  <<: *node_cache
  needs: [lint, typecheck]
  variables:
    # Demo mode build (no database/auth required)
    NODE_ENV: "production"
    NEXT_PUBLIC_DEMO_MODE: "true"
  script:
    - echo "Building Next.js application..."
    - echo "Commit: ${CI_COMMIT_SHORT_SHA}"
    - echo "Branch: ${CI_COMMIT_REF_NAME}"

    # Build the application
    - npm run build

    # Verify build artifacts
    - ls -lah .next/
    - echo "Build completed successfully"
  artifacts:
    name: "build-${CI_COMMIT_SHORT_SHA}"
    expire_in: 1 week
    paths:
      - .next/
      - public/
      - package.json
      - package-lock.json
      - next.config.ts
  <<: *only_branches

# Build Docker image (optional - for containerized deployments)
build_docker:
  stage: build
  image: docker:24-alpine
  services:
    - docker:24-dind
  needs: [lint, typecheck]
  variables:
    DOCKER_DRIVER: overlay2
    DOCKER_TLS_CERTDIR: "/certs"
    IMAGE_TAG: "$CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA"
    LATEST_TAG: "$CI_REGISTRY_IMAGE:latest"
  before_script:
    - docker info
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin $CI_REGISTRY
  script:
    - echo "Building Docker image..."
    - |
      docker build \
        --build-arg NODE_VERSION=${NODE_VERSION} \
        --build-arg BUILD_ID=${CI_COMMIT_SHORT_SHA} \
        -t ${IMAGE_TAG} \
        -t ${LATEST_TAG} \
        -f Dockerfile .
    - docker push ${IMAGE_TAG}
    - docker push ${LATEST_TAG}
    - echo "Docker image pushed: ${IMAGE_TAG}"
  rules:
    - if: '$CI_COMMIT_BRANCH == "main" || $CI_COMMIT_BRANCH == "master"'
    - if: '$CI_COMMIT_BRANCH == "develop"'
    - if: '$CI_COMMIT_TAG'
  when: manual
  allow_failure: true

# ============================================================================
# STAGE: INFRASTRUCTURE
# ============================================================================

# Terraform Plan (Infrastructure as Code)
infrastructure_plan:
  stage: infrastructure
  image: hashicorp/terraform:latest
  needs: [build_application]
  before_script:
    - cd infrastructure/ || echo "No infrastructure directory found"
  script:
    - echo "Running Terraform plan..."
    - echo "This job will provision:"
    - echo "  - PostgreSQL database (RDS/managed)"
    - echo "  - Application hosting (Vercel/VPS/Kubernetes)"
    - echo "  - CDN configuration"
    - echo "  - SSL certificates"
    - echo ""
    - echo "To implement:"
    - echo "  1. Create infrastructure/ directory"
    - echo "  2. Add Terraform/Pulumi/CDK configuration"
    - echo "  3. Update this job with actual commands"
    - echo ""
    - echo "Example Terraform commands:"
    - echo "  terraform init"
    - echo "  terraform plan -out=tfplan"
  artifacts:
    paths:
      - infrastructure/tfplan
    expire_in: 1 day
  rules:
    - if: '$CI_COMMIT_BRANCH == "main" || $CI_COMMIT_BRANCH == "master"'
    - if: '$CI_COMMIT_BRANCH == "develop"'
  when: manual
  allow_failure: true

# Terraform Apply (Manual approval required)
infrastructure_apply:
  stage: infrastructure
  image: hashicorp/terraform:latest
  needs: [infrastructure_plan]
  before_script:
    - cd infrastructure/ || echo "No infrastructure directory found"
  script:
    - echo "Applying infrastructure changes..."
    - echo "terraform apply tfplan"
  rules:
    - if: '$CI_COMMIT_BRANCH == "main" || $CI_COMMIT_BRANCH == "master"'
  when: manual
  allow_failure: true

# ============================================================================
# STAGE: DEPLOY STAGING
# ============================================================================

deploy_staging:
  extends: .node_base
  stage: deploy-staging
  needs: [build_application]
  environment:
    name: staging
    url: https://staging.angelo-tutoring.com
    on_stop: stop_staging
  variables:
    DEPLOY_ENV: "staging"
  before_script:
    - apk add --no-cache git curl openssh-client
    - eval $(ssh-agent -s)
    - echo "$STAGING_SSH_PRIVATE_KEY" | tr -d '\r' | ssh-add - || echo "SSH key not configured"
    - mkdir -p ~/.ssh
    - chmod 700 ~/.ssh
  script:
    - echo "Deploying to staging environment..."
    - echo "Environment URL: https://staging.angelo-tutoring.com"

    # Database migrations
    - echo "Running database migrations..."
    - |
      if [ -n "$STAGING_DATABASE_URL" ]; then
        export DATABASE_URL="$STAGING_DATABASE_URL"
        npm run db:push
        echo "Migrations completed"
      else
        echo "⚠️  STAGING_DATABASE_URL not set, skipping migrations"
      fi

    # Deploy based on platform
    - echo "Deployment method: ${DEPLOY_METHOD:-manual}"
    - |
      case "${DEPLOY_METHOD}" in
        "vercel")
          echo "Deploying to Vercel..."
          npm install -g vercel
          vercel deploy --prod --token=$VERCEL_TOKEN --env=staging
          ;;
        "vps")
          echo "Deploying to VPS..."
          rsync -avz --delete \
            --exclude 'node_modules' \
            --exclude '.git' \
            . $STAGING_SERVER_USER@$STAGING_SERVER_HOST:$STAGING_DEPLOY_PATH
          ssh $STAGING_SERVER_USER@$STAGING_SERVER_HOST "cd $STAGING_DEPLOY_PATH && npm ci && npm run build && pm2 restart angelo-tutoring-staging"
          ;;
        "kubernetes")
          echo "Deploying to Kubernetes..."
          kubectl set image deployment/angelo-tutoring-staging app=$CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA
          kubectl rollout status deployment/angelo-tutoring-staging
          ;;
        *)
          echo "⚠️  No deployment method configured"
          echo "Set DEPLOY_METHOD variable to: vercel, vps, or kubernetes"
          ;;
      esac

    - echo "✅ Staging deployment completed"
    - echo "URL: https://staging.angelo-tutoring.com"
  rules:
    - if: '$CI_COMMIT_BRANCH == "develop"'
    - if: '$CI_COMMIT_BRANCH == "main" || $CI_COMMIT_BRANCH == "master"'
      when: manual

# Stop staging environment
stop_staging:
  extends: .node_base
  stage: deploy-staging
  environment:
    name: staging
    action: stop
  script:
    - echo "Stopping staging environment..."
    - echo "This would typically scale down resources or stop services"
  when: manual
  rules:
    - if: '$CI_COMMIT_BRANCH == "develop"'

# ============================================================================
# STAGE: DEPLOY PRODUCTION
# ============================================================================

deploy_production:
  extends: .node_base
  stage: deploy-prod
  needs: [build_application]
  environment:
    name: production
    url: https://angelo-tutoring.com
  variables:
    DEPLOY_ENV: "production"
  before_script:
    - apk add --no-cache git curl openssh-client
    - eval $(ssh-agent -s)
    - echo "$PRODUCTION_SSH_PRIVATE_KEY" | tr -d '\r' | ssh-add - || echo "SSH key not configured"
    - mkdir -p ~/.ssh
    - chmod 700 ~/.ssh
  script:
    - echo "🚀 Deploying to PRODUCTION environment..."
    - echo "Environment URL: https://angelo-tutoring.com"
    - echo "Commit: ${CI_COMMIT_SHORT_SHA}"

    # Pre-deployment health check
    - echo "Running pre-deployment checks..."
    - curl -f https://angelo-tutoring.com/api/health || echo "Health check failed or endpoint not configured"

    # Database migrations (with backup)
    - echo "Running database migrations..."
    - |
      if [ -n "$PRODUCTION_DATABASE_URL" ]; then
        export DATABASE_URL="$PRODUCTION_DATABASE_URL"
        echo "⚠️  Creating database backup before migration..."
        # Add backup command here
        npm run db:push
        echo "Migrations completed"
      else
        echo "⚠️  PRODUCTION_DATABASE_URL not set, skipping migrations"
      fi

    # Deploy based on platform
    - echo "Deployment method: ${DEPLOY_METHOD:-manual}"
    - |
      case "${DEPLOY_METHOD}" in
        "vercel")
          echo "Deploying to Vercel..."
          npm install -g vercel
          vercel deploy --prod --token=$VERCEL_TOKEN
          ;;
        "vps")
          echo "Deploying to VPS..."
          rsync -avz --delete \
            --exclude 'node_modules' \
            --exclude '.git' \
            . $PRODUCTION_SERVER_USER@$PRODUCTION_SERVER_HOST:$PRODUCTION_DEPLOY_PATH
          ssh $PRODUCTION_SERVER_USER@$PRODUCTION_SERVER_HOST "cd $PRODUCTION_DEPLOY_PATH && npm ci && npm run build && pm2 restart angelo-tutoring"
          ;;
        "kubernetes")
          echo "Deploying to Kubernetes..."
          kubectl set image deployment/angelo-tutoring app=$CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA
          kubectl rollout status deployment/angelo-tutoring
          ;;
        *)
          echo "⚠️  No deployment method configured"
          echo "Set DEPLOY_METHOD variable to: vercel, vps, or kubernetes"
          ;;
      esac

    # Post-deployment verification
    - echo "Running post-deployment verification..."
    - sleep 10
    - curl -f https://angelo-tutoring.com/api/health || echo "Post-deployment health check failed"

    - echo "✅ Production deployment completed successfully"
    - echo "URL: https://angelo-tutoring.com"
  rules:
    - if: '$CI_COMMIT_BRANCH == "main" || $CI_COMMIT_BRANCH == "master"'
      when: manual
    - if: '$CI_COMMIT_TAG'
  allow_failure: false

# Rollback production deployment
rollback_production:
  extends: .node_base
  stage: deploy-prod
  environment:
    name: production
    url: https://angelo-tutoring.com
  script:
    - echo "🔄 Rolling back production deployment..."
    - echo "This will revert to the previous stable version"
    - |
      case "${DEPLOY_METHOD}" in
        "kubernetes")
          kubectl rollout undo deployment/angelo-tutoring
          kubectl rollout status deployment/angelo-tutoring
          ;;
        "vps")
          ssh $PRODUCTION_SERVER_USER@$PRODUCTION_SERVER_HOST "cd $PRODUCTION_DEPLOY_PATH && git checkout HEAD~1 && npm ci && npm run build && pm2 restart angelo-tutoring"
          ;;
        *)
          echo "Manual rollback required"
          ;;
      esac
    - echo "✅ Rollback completed"
  when: manual
  rules:
    - if: '$CI_COMMIT_BRANCH == "main" || $CI_COMMIT_BRANCH == "master"'

# ============================================================================
# CLEANUP JOBS
# ============================================================================

cleanup_cache:
  stage: .post
  script:
    - echo "Cleaning up old cache..."
    - rm -rf node_modules/.cache
  when: always
  allow_failure: true

# ============================================================================
# SCHEDULED JOBS (Configure in GitLab CI/CD Schedules)
# ============================================================================

# Database backup (schedule: daily)
backup_database:
  extends: .node_base
  stage: .pre
  script:
    - echo "Creating database backup..."
    - echo "pg_dump $PRODUCTION_DATABASE_URL > backup-$(date +%Y%m%d).sql"
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
  when: manual
  allow_failure: true

# ============================================================================
# NOTES FOR CONFIGURATION
# ============================================================================
#
# Required GitLab CI/CD Variables (Settings > CI/CD > Variables):
#
# STAGING ENVIRONMENT:
# - STAGING_DATABASE_URL: PostgreSQL connection string
# - STAGING_SERVER_HOST: Staging server hostname (for VPS)
# - STAGING_SERVER_USER: SSH user (for VPS)
# - STAGING_SSH_PRIVATE_KEY: SSH private key (for VPS)
# - STAGING_DEPLOY_PATH: Deployment path on server
# - NEXT_PUBLIC_SUPABASE_URL: Supabase project URL
# - NEXT_PUBLIC_SUPABASE_ANON_KEY: Supabase anonymous key
# - SUPABASE_SERVICE_ROLE_KEY: Supabase service role key
#
# PRODUCTION ENVIRONMENT:
# - PRODUCTION_DATABASE_URL: PostgreSQL connection string
# - PRODUCTION_SERVER_HOST: Production server hostname
# - PRODUCTION_SERVER_USER: SSH user
# - PRODUCTION_SSH_PRIVATE_KEY: SSH private key
# - PRODUCTION_DEPLOY_PATH: Deployment path
# - NEXT_PUBLIC_SUPABASE_URL: Supabase project URL
# - NEXT_PUBLIC_SUPABASE_ANON_KEY: Supabase anonymous key
# - SUPABASE_SERVICE_ROLE_KEY: Supabase service role key
# - ANTHROPIC_API_KEY: For AI hint generation
# - RESEND_API_KEY: For email sending
# - PAYFAST_MERCHANT_ID: PayFast payment gateway
# - PAYFAST_MERCHANT_KEY: PayFast payment gateway
#
# DEPLOYMENT:
# - DEPLOY_METHOD: vercel, vps, or kubernetes
# - VERCEL_TOKEN: Vercel deployment token (if using Vercel)
# - CI_REGISTRY: GitLab container registry URL
# - CI_REGISTRY_USER: Registry username
# - CI_REGISTRY_PASSWORD: Registry password
#
# ============================================================================
